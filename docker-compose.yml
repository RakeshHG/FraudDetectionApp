version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-container
    restart: always
    environment:
      # These are the correct variables for the MySQL image
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: frauddb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - springboot-network

  springboot-app:
    build: .
    container_name: springboot-container-fraudapp
    # Tells Docker to reboot the app if it crashes because MySQL isn't ready yet
    restart: on-failure 
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: JDBC
      # Standard Spring Boot environment variables
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/frauddb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: n3u3da!
    ports:
      - "8082:8082"
    networks:
      - springboot-network

volumes:
  mysql-data:

networks:
  springboot-network: